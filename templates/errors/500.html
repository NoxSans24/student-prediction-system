{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="error-container">
    <h1>500</h1>
    <p>Internal server error</p>
    {% if error %}<p class="error-detail">{{ error }}</p>{% endif %}
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
